name: Compiler Helios (APK)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer le projet (ZIP ou fichiers à plat)
        run: |
          if [ -f Helios.zip ]; then
            unzip -oq Helios.zip
            cp -r Helios/projet_complet/. .
          fi
          if [ -f organiser.sh ]; then bash organiser.sh; fi
          ls -R app | head -50

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compiler l'APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Helios-APK
          path: app/build/outputs/apk/debug/app-debug.apk
